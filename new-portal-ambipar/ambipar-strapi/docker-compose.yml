version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ambipar-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ambipar_strapi
      POSTGRES_USER: strapi
      POSTGRES_PASSWORD: strapi_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: